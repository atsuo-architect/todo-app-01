name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Run migrations
        run: |
          docker compose exec -T web \
            python manage.py migrate

      - name: Run tests
        run: |
          docker compose exec -T web \
            pytest
