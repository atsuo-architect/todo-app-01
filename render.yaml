services:
  - type: web
    name: todo-app-01-web
    runtime: python
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: todo-app-01-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: todo-app-01-redis
          property: connectionString

      - key: ALLOWED_HOSTS
        value: "*"


  - type: keyvalue
    name: todo-app-01-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: todo-app-01-db
    plan: free
